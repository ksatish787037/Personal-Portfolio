<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satya - Developer Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,700;1,600&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background-color: rgb(0, 0, 33);
        color: white;
        font-family: 'Poppins', sans-serif;
      }
      nav {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 20px 50px;
        height: 30px;
        background-color: rgb(3, 3, 17);
      }
      nav ul {
        display: flex;
        justify-content: center;
      }
      nav ul li{
          list-style: none;
          margin: 40px 80px;
      }
      nav ul li a{
          text-decoration: none;
          color: white;
          
      }
      nav ul li a:hover{
          color: rgb(83, 45, 118);
          font-size: 1.02rem;
      }
      main hr{
        border:0;
        background: rgb(123, 112, 133);
        height: 1.2px;
        margin: 40px 80px;
      }
      .left{
          font-size: 1.5rem;
      }

      .firstSection{
          display: flex;
          justify-content: space-around;
          align-items: center;
          margin:  140px 0px;
      }
      .firstSection > div{
        width: 30%;
      }
      .leftSection{
          font-size: 3rem;
      }
      .rightSection img{
          width: 30%;
          margin: 10px 500px;
      }
      .purple{
          color: rgb(83, 45, 118);
      }
      .text-gray{
          color: rgb(123, 112, 133);
      }
      #element{
          color: rgb(45, 118, 50);
      }
      .secondSection{
        max-width: 80vw;
        margin: auto;
        height: 80vh;
      }
      .secondSection h1{
        font-size: 1.5rem;
      }
      .secondSection .box{
        background-color: white;
        width: 80vw;
        height: 2px;
        margin: 56px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <div class="left">Satish Portfolio</div>
        <div class="right">
          <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
        </div>
      </nav>
    </header>
    <main>
      <section class="firstSection">
        <div class="leftSection">
          Hi , My name is <span class="purple">Satish</span>
<!-- 
          <div>and i am a web developer and i love to create beautiful websites.</div> -->
          <span id="element"></span>
        </div>
        <div class="rightSection">
          <img src="satya.png">
        </div>
      </section>
      <hr>
      <section class="secondSection">
        <span class="text-gray">What i done have so far </span>
        <h1>Work Experience</h1>

        <div class="box">
            <div class="vertical"></div>
            <div class="vertical"></div>
            <div class="vertical"></div>
        </div>
      </section>
    </main>
    <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
  <script>
    var typed = new Typed('#element', {
      strings: ['I currently pursuing dual degree 1st is B.TECH in civil engineering.', 'and 2nd is B.S in computer science and engineering from IIT Patna.', 'I am a web developer and i love to create beautiful websites.'],
      typeSpeed: 50,
    });
  </script>
  </body>
</html>
